<header class="head"><h1>商品信息</h1><p>填写商品信息，生成可扫码查看的商品归属二维码。适合打印后贴在商品或包装上。</p></header>
<section class="card form-card"><div class="grid">
<div class="field"><label for="customer">客户名称</label><input id="customer" maxlength="100" placeholder="例如：安迪先生"></div>
<div class="field"><label for="phone">联系电话</label><input id="phone" type="tel" maxlength="50" placeholder="例如：13800000000"></div>
<div class="field"><label for="receiveAddress">收货地址</label><input id="receiveAddress" maxlength="250" placeholder="填写收货地址"></div>
<div class="field"><label for="shipAddress">发货地址</label><input id="shipAddress" maxlength="250" placeholder="填写发货地址"></div>
<div class="field"><label for="product">商品名称</label><input id="product" maxlength="120" placeholder="例如：蓝色收纳盒"></div>
<div class="field"><label for="quantity">商品数量</label><input id="quantity" type="text" maxlength="80" placeholder="例如：500件、约500箱、500套"></div>
<div class="field"><label for="batch">商品批次</label><input id="batch" maxlength="100" placeholder="例如：2026-10-A01"></div>
<div class="field full"><label for="remark">备注信息</label><textarea id="remark" maxlength="500" placeholder="选填：规格、仓库、订单号等"></textarea></div>
</div><div class="actions"><button id="generate">生成二维码</button><button id="clear" class="secondary" type="button">清空</button></div><div id="status" class="status" role="status"></div></section>
<section class="card result-card"><div class="result"><div class="qrbox" id="qrbox"><div class="placeholder">二维码将在这里显示<br>请先填写商品信息并点击“生成二维码”</div></div><div class="info"><h2>二维码内容预览</h2><p>工作人员使用手机相机或扫码工具扫描后，可查看下面这些登记信息。</p><div class="preview" id="preview">尚未生成</div><div class="actions"><button id="download" disabled>保存到相册</button><button id="print" class="secondary" disabled>打印二维码</button></div></div></div><div class="label-print" id="printlabel"></div></section>

	setupTimingPattern : function() {

				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {

							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}

							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;

							byteIndex++;

						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}

		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);

		var modPoly = rawPoly.mod(rsPoly);

		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

<script>
(()=>{const params=new URLSearchParams(location.search);if(params.get('view')==='1'){const d={customer:params.get('customer')||'',phone:params.get('phone')||'',receiveAddress:params.get('receiveAddress')||'',shipAddress:params.get('shipAddress')||'',product:params.get('product')||'',quantity:params.get('quantity')||'',batch:params.get('batch')||'',remark:params.get('remark')||''};document.title='商品归属信息';document.body.className='scan-view';document.body.innerHTML='';const card=document.createElement('main');card.className='scan-card';const h=document.createElement('h1');h.textContent='商品归属信息';card.appendChild(h);const divider=document.createElement('div');divider.className='scan-divider';card.appendChild(divider);const rows=[['客户名称',d.customer],['联系电话',d.phone||'无'],['收货地址',d.receiveAddress||'无'],['发货地址',d.shipAddress||'无'],['商品名称',d.product],['商品数量',d.quantity],['商品批次',d.batch],['备注信息',d.remark||'无']];rows.forEach(([label,value],i)=>{const row=document.createElement('div');row.className='scan-row';const lab=document.createElement('span');lab.className='scan-label';lab.textContent=label+'：';const val=document.createElement('span');val.className='scan-value';val.textContent=value;row.append(lab,val);card.appendChild(row)});const bottom=document.createElement('div');bottom.className='scan-divider';card.appendChild(bottom);document.body.appendChild(card);return;}const $=id=>document.getElementById(id);let qr=null;const fields=['customer','phone','receiveAddress','shipAddress','product','batch','quantity','remark'];
